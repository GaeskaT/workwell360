<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 360 transition ring -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round">
    <path d="M256 118 a138 138 0 1 1 -110 55" opacity="0.95"/>
  </g>
  <!-- arrow head closing the loop (transition / continuity) -->
  <path d="M256 92 l40 26 -40 26 z" fill="#ffffff"/>
  <!-- wellness heart-leaf in the centre -->
  <path d="M256 330
           c-70 -46 -104 -92 -104 -138
           a52 52 0 0 1 104 -14
           a52 52 0 0 1 104 14
           c0 46 -34 92 -104 138 z" fill="url(#leaf)"/>
  <!-- leaf vein -->
  <path d="M256 196 v118 M256 250 l-34 -22 M256 250 l34 -22" stroke="#0f766e" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.55"/>
</svg>
